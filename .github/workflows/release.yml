name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Set up release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(./gradlew :app:printVersionName -q --no-daemon | grep VERSION_NAME | cut -d= -f2)
            echo "tag=$V" >> "$GITHUB_OUTPUT"
            echo "ref=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksum
        id: sha
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.ref }}"
          if [[ -z "$TAG" ]]; then TAG="${{ github.ref_name }}"; fi
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --title "Pouch ${{ steps.ver.outputs.tag }}" \
            --notes "Download **Pouch ${{ steps.ver.outputs.tag }}** and install the APK directly on your device.

SHA-256: \`${{ steps.sha.outputs.sha }}\`" \
            --generate-notes
